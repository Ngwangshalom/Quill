[package]
name = "quill"
version = "0.3.0"
edition = "2021"
description = "A readable, safe programming language for backends and AI-powered apps."
license = "Apache-2.0"
repository = "https://github.com/Ngwangshalom/Quill"
readme = "README.md"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
dialoguer = { version = "0.12.0", default-features = false }
serde_json = "1.0.154"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
