[package]
name = "quill"
version = "0.1.0"
edition = "2021"
description = "A readable, safe programming language for backends and AI-powered apps."
license = "Apache-2.0"
repository = "https://github.com/Ngwangshalom/Quill"
readme = "README.md"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
