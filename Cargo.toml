[package]
name = "quill"
version = "0.4.0"
edition = "2021"
description = "A programming language where intent is clear, failures are explicit, and correctness is part of the code."
license = "Apache-2.0"
repository = "https://github.com/Ngwangshalom/Quill"
readme = "README.md"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
dialoguer = { version = "0.12.0", default-features = false }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
